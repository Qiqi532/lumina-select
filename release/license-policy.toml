deny_packages = ["pyiqa"]
deny_license_terms = [
  "polyform noncommercial",
  "cc-by-nc",
  "non-commercial",
  "research only",
]
# PySide6 / shiboken6 为 LGPLv3（Qt 官方）。发行时必须满足 LGPL 义务：
# 随包附 LGPL-3.0.txt 全文（因 LGPLv3 以引用方式并入 GPLv3，还须一并附 GPL-3.0.txt）、
# 在 THIRD_PARTY_NOTICES.md 声明、保持 onedir 形态以保证可替换性。
# 注意：本环境实际安装的是 PySide6-Essentials（真正承载 Qt 运行库的 LGPL 包）
# 与 shiboken6；`pyside6` 元包未安装，故不列入（列入会因元数据缺失误报）。
manual_review_packages = ["PySide6-Essentials", "shiboken6"]

# copyleft 组件：发行时强制校验"发行目录内确有全文"（脚本内 audit_lgpl_bundle）。
lgpl_packages = ["PySide6-Essentials", "shiboken6"]
